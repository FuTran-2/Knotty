# AWS SAM template — deploys the Knotty backend
#
# Prerequisites:
#   1. Install AWS CLI:  https://docs.aws.amazon.com/cli/latest/userguide/install-cliv2.html
#   2. Install SAM CLI:  https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/install-sam-cli.html
#   3. Configure credentials:  aws configure
#
# Deploy (run from this backend/ folder):
#   sam build
#   sam deploy --guided          ← first time (saves answers to samconfig.toml)
#   sam deploy                   ← subsequent deploys
#
# After deploy, SAM prints the API Gateway URL.  Put it in your .env.local:
#   VITE_UPLOAD_URL_ENDPOINT=https://xxxxxxxxxx.execute-api.us-east-1.amazonaws.com/prod/upload-url

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Knotty backend — S3 presigned URL generator

# ─── Parameters (prompted by `sam deploy --guided`) ───────────────────────────
Parameters:
  BucketName:
    Type: String
    Description: Name of the S3 bucket for contact photos (must be globally unique)
    Default: knotty-photos

  FrontendOrigin:
    Type: String
    Description: Your frontend URL for CORS (e.g. https://knotty.yourdomain.com). Use * to allow all.
    Default: '*'

# ─── Resources ────────────────────────────────────────────────────────────────
Resources:

  # S3 bucket that stores the contact photos
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendOrigin
            AllowedMethods: [GET, PUT]
            AllowedHeaders: ['*']
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls:       false
        BlockPublicPolicy:     false
        IgnorePublicAcls:      false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter

  # Bucket policy — allow public GET so stored photos can be displayed in the app
  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${BucketName}/photos/*'

  # Lambda function
  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: knotty-upload-url
      CodeUri: upload-url/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]       # cheaper + faster than x86_64
      Timeout: 10
      Environment:
        Variables:
          BUCKET_NAME:      !Ref BucketName
          FRONTEND_ORIGIN:  !Ref FrontendOrigin
      # IAM: grant only PutObject on the photos/ prefix — nothing else
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${BucketName}/photos/*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /upload-url
            Method: GET

# ─── Outputs ──────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: Add this to your frontend .env.local as VITE_UPLOAD_URL_ENDPOINT
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/upload-url'

  BucketName:
    Description: S3 bucket name
    Value: !Ref PhotosBucket
